dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  flutter_gen_runner: 5.3.2
  hive_generator: ^2.0.1

flutter:
  #  library: true
  uses-material-design: true
  # if folder is empty it will not push to GitHub. comment it or add .gitkeep file in empty folder
  assets:
    - assets/
    - assets/audios/
    - assets/gifs/
    - assets/icons/
    - assets/images/
    - assets/jsons/
    - assets/lottiefiles/
    - assets/scripts/
    - assets/texts/
    - assets/videos/

topics:
  - class
  - widget
  - animation
  - extension


screenshots:
  - path: screenshots/flutterprovider.png
    description: "Package icon"
  # - path: screenshots/button_pressed.png
  #   description: "Button pressed animation"

